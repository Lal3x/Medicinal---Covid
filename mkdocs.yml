site_name: Medicinal
site_description: Documentação do projeto de simulação de pipeline de dados com SQL e Python
site_author: Lucas Alexandre
site_url: null
repo_url: https://github.com/your-user/medicinal
repo_name: medicinal

nav:
  - Início: index.md
  - Visão Geral: arquitetura.md
  - Estrutura do Projeto: estrutura.md
  - Instalação e Execução: instalacao.md
  - Pipeline: pipeline.md

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.code.annotate
  palette:
    - scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Modo claro
    - scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Modo escuro

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search

extra:
  social: []
